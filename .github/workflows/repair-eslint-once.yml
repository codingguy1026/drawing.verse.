name: One-time ESLint compatibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'ci: repair ESLint peer compatibility'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install ESLint supported by Next config plugins
        run: npm install --save-dev --save-exact eslint@9.39.5
      - name: Verify existing features and types
        run: |
          npm test
          npm run typecheck
      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: Print lint findings
        run: npm run lint || echo "Existing source lint findings need follow-up."
      - name: Commit verified ESLint version and matching lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-eslint-once.yml
          git add package.json package-lock.json .github/workflows/repair-eslint-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): use compatible ESLint 9 toolchain"
            git push origin HEAD:main
          fi
